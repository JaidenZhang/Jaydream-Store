<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Produk | JaydreamStore</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav>
    <div class="logo">
        <img src="assets/logo.png">
        <h2>JaydreamStore</h2>
    </div>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="store.html">Store</a></li>
    </ul>
    <button id="nav-auth-btn" onclick="window.location.href='login.html'">Login</button>
</nav>
<section class="product-detail">
    <div class="product-left">
        <img id="product-image">
    </div>
    <div class="product-right">
        <span id="product-category" class="badge"></span>
        <h1 id="product-name"></h1>
        <h2 id="product-price"></h2>
        <div id="product-description" style="margin-bottom: 20px;"></div>
        <div class="quantity">
            <button onclick="minus()">-</button>
            <span id="qty">1</span>
            <button onclick="plus()">+</button>
        </div>
        <div class="buttons">
            <button class="buy" onclick="buyNow()">Beli Sekarang</button>
        </div>
    </div>
</section>
<script src="js/auth-config.js"></script>
<script src="js/auth-client.js"></script>
<script src="js/product.js"></script>
</body>
</html>
