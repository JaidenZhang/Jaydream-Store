<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Produk | JayDreamStore</title>
    <link rel="stylesheet" href="css/style.css">
  </head>

  <body>
    <nav>
      <div class="logo">
        <img src="assets/logo.png" alt="Logo JayDreamStore">
        <h2>JaydreamStore</h2>
      </div>

      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="store.html">Store</a></li>
      </ul>

      <button type="button" onclick="location.href='dashboard.html'">
        Dashboard
      </button>
    </nav>

    <main>
      <section class="product-detail">
        <div class="product-left">
          <img id="product-image" src="" alt="Gambar produk">
        </div>

        <div class="product-right">
          <span id="product-category" class="badge"></span>

          <h1 id="product-name">Memuat produk...</h1>
          <h2 id="product-price"></h2>
          <p id="product-description"></p>

          <div class="quantity" aria-label="Jumlah produk">
            <button type="button" onclick="minus()" aria-label="Kurangi jumlah">
              −
            </button>
            <strong id="qty">1</strong>
            <button type="button" onclick="plus()" aria-label="Tambah jumlah">
              +
            </button>
          </div>

          <div class="buttons">
            <button class="buy" type="button" onclick="buyNow()">
              Beli Sekarang
            </button>
          </div>

          <p id="product-status" role="status" aria-live="polite"></p>
        </div>
      </section>
    </main>

    <script src="js/product.js"></script>
  </body>
</html>
