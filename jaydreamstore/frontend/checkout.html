<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | JaydreamStore</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav>

    <div class="logo">

        <img src="assets/logo.png">

        <h2>JaydreamStore</h2>

    </div>

</nav>

<section class="checkout">

    <h1>Checkout</h1>

    <div class="checkout-container">

        <div class="checkout-left">

            <div class="product-box">

                <img id="checkout-image">

                <div>

                    <h2 id="checkout-name"></h2>

                    <p id="checkout-category"></p>

                    <h3 id="checkout-price"></h3>

                </div>

            </div>

            <div class="buyer-box">

                <h2>Email :</h2>

                <input type="email" id="email" required>

            </div>


            </div>

        </div>

        <div class="checkout-right">

            <div class="summary">

                <h2>Ringkasan</h2>

                <div class="row">

                    <span>Harga</span>

                    <span id="summary-price"></span>

                </div>

                <div class="row">

                    <span>Biaya Admin</span>

                    <span>Rp0</span>

                </div>

                <hr>

                <div class="row total">

                    <span>Total</span>

                    <span id="summary-total"></span>

                </div>

                <button id="pay-button">

                    Bayar Sekarang

                </button>

            </div>

        </div>

    </div>

</section>
<script
    type="text/javascript"
    src="https://app.midtrans.com/snap/snap.js"
    data-client-key="Mid-client-lkrf9ubT1vBaFf7K">
</script>

<script src="js/checkout.js"></script>
</body>
</html>
